# Compiles the Watch icon (Design/WatchIcon.xcassets) into Watch/Icon/Assets.car. actool needs a
# watchOS simulator runtime for that, which the build Mac doesn't keep (disk); GitHub's runners
# have one. Run it after changing the icon, then commit the artifact (see README "Icon").
name: watch-icon
on: workflow_dispatch
jobs:
  compile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          xcrun actool Design/WatchIcon.xcassets --compile out --platform watchos \
            --minimum-deployment-target 11.0 --target-device watch --app-icon AppIcon \
            --output-partial-info-plist out/partial.plist --output-format human-readable-text
          ls -la out; plutil -p out/partial.plist
      - uses: actions/upload-artifact@v4
        with: { name: watch-icon, path: out }
